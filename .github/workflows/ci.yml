name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, so a production
  # migration is never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Stages are expressed through job names (check:*, build, test:*, deploy:*).
# Jobs run in parallel except for real dependencies: test:e2e runs against the
# build job's output, and deploy:migrate waits for every check on main. The app
# itself is deployed by Vercel's GitHub integration.
jobs:
  check-lint:
    name: check:lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Biome check covers formatting, linting and import sorting.
      - run: pnpm lint

  check-migrations:
    name: check:migrations
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Schema changes must ship with a committed migration. Journal ordering is
      # checked by src/lib/db/migrations.test.ts (test:unit).
      - run: pnpm db:generate
      - name: Fail if schema.ts has changes without a migration
        run: |
          if [ -n "$(git status --porcelain -- src/lib/db/migrations)" ]; then
            git status --short -- src/lib/db/migrations
            echo "::error::schema.ts changed without a migration. Run pnpm db:generate and commit the result."
            exit 1
          fi

  check-types:
    name: check:types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # Real secrets are not needed to build; runtime env is provided where the
      # app is started (Vercel for deploys, playwright.config.ts for e2e).
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_GOOGLE_API_KEY: e2e-google-api-key
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  test-integration:
    name: test:integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:integration

  test-e2e:
    name: test:e2e
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: perkiweb_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perkiweb_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - run: pnpm exec playwright install --with-deps chromium
      # Reuse the build job's output instead of building again.
      - run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Applies pending migrations to production once everything on main is green.
  # Vercel deploys the same commit in parallel, so migrations must stay
  # compatible with the previous release (add first, remove in a later PR).
  deploy-migrate:
    name: deploy:migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        check-lint,
        check-migrations,
        check-types,
        test-unit,
        test-integration,
        test-e2e,
      ]
    runs-on: ubuntu-latest
    environment: production-database
    concurrency:
      group: deploy-migrate-production
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
