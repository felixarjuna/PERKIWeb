name: Setup
description: Install pnpm, Node.js and project dependencies (with pnpm store cache).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
