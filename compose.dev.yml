# Local development Postgres. Unlike compose.test.yml, data persists in a named
# volume across restarts. Start with `pnpm db:dev`, then `pnpm db:migrate` and
# `pnpm db:seed`. Remove everything with `pnpm db:dev:down --volumes`.
# Own project name so it never collides with the e2e stack (compose.test.yml).
name: perkiweb-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: perkiweb_dev
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - perkiweb-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perkiweb_dev"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  perkiweb-dev-data:
